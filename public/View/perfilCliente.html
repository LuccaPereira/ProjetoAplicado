<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Perfil</title>
    <link rel="stylesheet" href="../css/perfilCliente.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <header class="header">
        <img src="../img/logo.png" alt="Logo do Sistema" class="logo">
        <nav class="nav">
            <ul class="nav-list">
                <li><a href="../View/telaInicialCliente.html"><span class="material-icons" title="Início">home</span></a></li>
                <li><a href="../View/perfilCliente.html"><span class="material-icons" title="Perfil">account_circle</span></a></li>
                <li><a href="../View/tabelaCliente.html"><span class="material-icons" title="Tabela">table_view</span></a></li>
                <li><a href="../View/chat.html"><span class="material-icons" title="Chat">smart_toy</span></a></li>
                <li><a id="logoutButton"><span class="material-icons" title="Logout">exit_to_app</span></a></li>
            </ul>
        </nav>
    </header>

    <main class="profile-grid">
        <aside class="profile-image-section">
            <label for="profile-image-upload">
                <img src="https://via.placeholder.com/150" alt="Imagem de Perfil" class="profile-image">
                <input type="file" id="profile-image-upload" accept="image/*">
            </label>
        </aside>
        <section class="profile-info">
            <div class="profile-field">
                <label for="nome">Nome:</label>
                <div id="nome" class="readonly"></div>
            </div>
            <div class="profile-field">
                <label for="senha">Senha:</label>
                <div id="senha" class="readonly"></div>
            </div>
            <div class="profile-field">
                <label for="cpf">CPF:</label>
                <div id="cpf" class="readonly"></div>
            </div>
            <div class="profile-field">
                <label for="email">Email:</label>
                <div id="email" class="readonly"></div>
            </div>
            <div class="profile-field">
                <label for="location">Localização:</label>
                <div id="location" class="readonly">São Paulo, Brasil</div>
            </div>
        </section>
        <div class="profile-actions">
            <button id="editProfileButton">Editar Perfil</button>
            <button id="saveProfileBtn">Salvar</button>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2024 - Todos os direitos reservados</p>
        <ul class="footer-links">
            <li><a href="#">Termos de uso</a></li>
            <li><a href="#">Política de privacidade</a></li>
            <li><a href="#">Sobre nós</a></li>
            <li><a href="#">Contato</a></li>
        </ul>
    </footer>

    <script type="module" src="../Controller/perfilCliente.controller.js"></script>
</body>
</html>
