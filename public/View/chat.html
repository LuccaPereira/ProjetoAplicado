<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duvidas jurídicas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="../css/chat.css">
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function sendMessage() {
            const input = document.getElementById('messageInput').value;
            if (input.trim() !== '') { // Verifica se a mensagem não está vazia
                socket.emit('sendMessage', input);
                
                // Adiciona a mensagem enviada à tela
                const chat = document.getElementById('messages');
                const messageElement = document.createElement('div');
                messageElement.className = 'user-message'; // Classe para mensagens do usuário
                messageElement.textContent = `Você: ${input}`; // Exibe a mensagem do usuário
                chat.appendChild(messageElement);
                chat.scrollTop = chat.scrollHeight; // Rolagem para baixo

                document.getElementById('messageInput').value = ''; // Limpar o input
            }
        }

        socket.on('receiveMessage', (message) => {
            const chat = document.getElementById('messages');
            const messageElement = document.createElement('div');
            messageElement.className = 'bot-message'; // Classe para mensagens do bot
            messageElement.textContent = `${message}`; // Exibe a resposta do chatbot
            chat.appendChild(messageElement);
            chat.scrollTop = chat.scrollHeight; // Rolagem para baixo
        });
    </script>
    <style>
        /* Container principal do chat */
/* Estilo base para o container do chatbot */
.chatBotContainer {
    margin-left: 2px;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    background-color: #f5f5f7;
}

/* Estilo para o cartão do chatbot */
.chatbot-card {
    background-color: #ffffff;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    width: 500px;
    max-width: 100%;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* Título do chatbot */
.chatbot-card .card-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 20px;
    text-align: center;
}

/* Janela de mensagens */
.chat-window {
    border: 1px solid #d1d1d6;
    border-radius: 8px;
    padding: 10px;
    height: 300px;
    overflow-y: auto;
    background-color: #f9f9f9;
}

/* Estilo para as mensagens */
.messages {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.user-message, .bot-message {
    padding: 10px;
    border-radius: 8px;
    max-width: 70%;
    word-wrap: break-word;
}

.user-message {
    align-self: flex-end;
    background-color: #007aff;
    color: white;
}

.bot-message {
    align-self: flex-start;
    background-color: #e5e5ea;
    color: #1c1c1e;
}

/* Caixa de entrada e botão de envio */
.input-group {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
}

.input-group .form-control {
    flex: 1;
    border-radius: 8px;
    padding: 10px;
    border: 1px solid #d1d1d6;
    font-size: 14px;
}

.input-group .btn {
    background-color: #007aff;
    color: white;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.3s ease-in-out;
}

.input-group .btn:hover {
    background-color: #0051a8;
}
    </style>
    
</head>
<body>
    <div class="container text-center py-5">
        <img src="../img/logo.png" alt="Logo do Sistema" width="150">
        <div class="profile-icon my-3" id="ProfileContainer">
            <ul>
                <li>
                    <a href="../View/telaInicialCliente.html">
                        <span class="material-icons" id="home" aria-label="Início" title="Ir para a tela inicial">home</span>
                    </a>
                </li>
                <li>
                    <a href="../View/perfilCliente.html">
                        <span alt="Ícone de Perfil" class="material-icons" id="Profile" title="Ir para o perfil">account_circle</span>
                    </a>
                </li>
                <li>
                    <a href="../View/tabelaCliente.html">
                        <span class="material-icons" id="tabelaView" alt="Search" title="Ir para Busca">search</span>
                    </a>
                </li>
                <li><a href="../View/tabelaArquivadosCliente.html"><span class="material-icons">table_view</span></span></a></li>
                <li>
                    <a href="../View/chatbot.html">
                        <span class="material-icons" id="ChatBot" alt="chatBot" title="ir para chatBot">smart_toy</span>
                    </a>
                </li>
                <li>
                    <a id="logoutButton">
                        <span class="material-icons">exit_to_app</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>

    <div class="chatBotContainer">
        <div class="chatbot-card">
            <div class="card-body">
                <h5 class="card-title"> Retire aqui suas dúvidas jurídicas!</h5>
                <div class="chat-window" id="chatWindow">
                    <div class="messages" id="messages"></div>
                </div>
                <div class="input-group mt-3">
                    <input type="text" class="form-control" id="messageInput" placeholder="Digite sua mensagem...">
                    <button class="btn btn-primary" type="button" onclick="sendMessage()">Enviar</button>
                </div>
            </div>
        </div>
    </div>    

    <footer class="text-center py-3">
        <p>&copy; 2024 - Todos os direitos reservados</p>
        <nav>
            <ul class="list-unstyled d-inline-flex gap-3">
                <li><a href="#">Termos de uso</a></li>
                <li><a href="#">Política de privacidade</a></li>
                <li><a href="#">Sobre nós</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
