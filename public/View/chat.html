<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat ao Vivo com Gemini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <link rel="stylesheet" href="../css/chatbot.css">
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        function sendMessage() {
            const input = document.getElementById('messageInput').value;
            if (input.trim() !== '') { // Verifica se a mensagem não está vazia
                socket.emit('sendMessage', input);
                
                // Adiciona a mensagem enviada à tela
                const chat = document.getElementById('messages');
                const messageElement = document.createElement('div');
                messageElement.className = 'user-message'; // Classe para mensagens do usuário
                messageElement.textContent = `Você: ${input}`; // Exibe a mensagem do usuário
                chat.appendChild(messageElement);
                chat.scrollTop = chat.scrollHeight; // Rolagem para baixo

                document.getElementById('messageInput').value = ''; // Limpar o input
            }
        }

        socket.on('receiveMessage', (message) => {
            const chat = document.getElementById('messages');
            const messageElement = document.createElement('div');
            messageElement.className = 'bot-message'; // Classe para mensagens do bot
            messageElement.textContent = `Resposta: ${message}`; // Exibe a resposta do chatbot
            chat.appendChild(messageElement);
            chat.scrollTop = chat.scrollHeight; // Rolagem para baixo
        });
    </script>
    <style>
        .chat-window {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 10px;
            padding: 10px;
        }
        .messages {
            margin-bottom: 10px;
        }
        .user-message {
            background-color: #e0f7fa; /* Cor da mensagem do usuário */
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: left; /* Alinha à esquerda */
        }
        .bot-message {
            background-color: #ffe0b2; /* Cor da mensagem do bot */
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: left; /* Alinha à esquerda */
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <img class="logo" src="../img/logo.png" alt="Logo">
        <span class="material-icons menu-icon" id="menuToggle">menu</span>
        <ul class="nav-list">
            <li>
                <button class="btn btn-outline-center" id="loginButton">
                    <span class="material-icons">account_circle</span>
                    <span class="login-text">Perfil</span>
                </button>
            </li>
            <li><a href="../View/menu.html"><span class="material-icons">home</span><span class="nav-text">Home</span></a></li>
            <li><a href="../View/consultar-modelo.html"><span class="material-icons">search</span><span class="nav-text">Consultar Petição</span></a></li>
            <li><a href="../View/cadastrarPeticao.html"><span class="material-icons">description</span><span class="nav-text">Cadastrar Petição</span></a></li>
            <li><a href="../View/criarClientes.html"><span class="material-icons">person_add</span><span class="nav-text">Cadastrar Clientes</span></a></li>
            <li><a href="../View/tabelaArquivados.html"><span class="material-icons">table_view</span><span class="nav-text">Arquivados</span></a></li>
            <li>
                <button class="btn btn-outline-danger" id="logoutButton">
                    <span class="material-icons">exit_to_app</span>
                    <span class="logout-text">Logout</span>
                </button>
            </li>
        </ul>
    </div>

    <div class="chatBotContainer" style="margin-left: 120px; padding: 20px;">
        <div class="chatbot-card">
            <div class="card-body">
                <h5 class="card-title">Chat ao Vivo com Gemini</h5>
                <div class="chat-window" id="chatWindow">
                    <div class="messages" id="messages"></div>
                </div>
                <div class="input-group mt-3">
                    <input type="text" class="form-control" id="messageInput" placeholder="Digite sua mensagem...">
                    <button class="btn btn-primary" type="button" onclick="sendMessage()">Enviar</button>
                </div>
            </div>
        </div>
    </div>    

    <footer class="text-center py-3">
        <p>&copy; 2024 - Todos os direitos reservados</p>
        <nav>
            <ul class="list-unstyled d-inline-flex gap-3">
                <li><a href="#">Termos de uso</a></li>
                <li><a href="#">Política de privacidade</a></li>
                <li><a href="#">Sobre nós</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
